<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Hub — HMRC Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="./game-tiles.css?v=1" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1a1420;
        overflow: hidden;
      }
      body {
        font-family: Arial, sans-serif;
      }
      #game-root {
        position: fixed;
        inset: 0;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      #game-root.visible {
        visibility: visible;
        opacity: 1;
      }
      #game-root canvas {
        display: block;
      }
      .hmrc-hud {
        position: fixed;
        left: 16px;
        top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(20, 14, 26, 0.72);
        color: #fff;
        font-size: 12px;
        letter-spacing: 0.06em;
        backdrop-filter: blur(4px);
        z-index: 1;
      }
      .hmrc-hud a { color: #ffe08a; text-decoration: none; font-weight: 700; }
      .hmrc-hud a:hover { text-decoration: underline; }
      .hmrc-hud .title { font-weight: 800; letter-spacing: 0.1em; }
      .hmrc-hud .keys { opacity: 0.75; }

      .onboarding-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(11, 13, 20, 0.8);
        backdrop-filter: blur(6px);
        z-index: 10;
      }

      .onboarding-card {
        width: min(420px, calc(100vw - 32px));
        background: rgba(26, 24, 34, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        padding: 24px 22px 18px;
        color: #f3f4f7;
      }

      .onboarding-card h2 {
        margin: 0 0 8px;
        font-size: 28px;
        text-align: center;
      }

      .onboarding-card p {
        margin: 0 0 20px;
        color: #d3d7df;
        text-align: center;
        font-size: 14px;
      }

      .form-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .form-row label {
        font-weight: 700;
        font-size: 14px;
        color: #e8edf8;
      }

      .form-row input,
      .form-row select {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        padding: 12px 14px;
        font-size: 15px;
      }

      .form-row input:focus,
      .form-row select:focus {
        outline: 2px solid rgba(255, 201, 106, 0.7);
        border-color: transparent;
      }

      .error-text {
        min-height: 18px;
        margin: 6px 0 0;
        color: #ff8c8c;
        font-size: 12px;
      }

      .submit-btn {
        display: block;
        width: 100%;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #f7c76e, #d98d2d);
        color: #1b140d;
        font-weight: 800;
        padding: 12px 14px;
        cursor: pointer;
        font-size: 15px;
      }

      .submit-btn:hover {
        filter: brightness(1.03);
      }

      .hidden {
        display: none !important;
      }

      /* "Press ENTER to interact" at a stall: same look as the games' HINT button. */
      .interact-hint {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 5;
        padding: 9px 14px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        background: rgba(9, 14, 18, 0.72);
        color: #fff;
        font: 700 12px Arial, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        backdrop-filter: blur(6px);
        cursor: pointer;
        animation: hintIn 0.2s ease;
      }
      .interact-hint:hover { border-color: #fff; }
      .interact-hint[hidden] { display: none; }
      .interact-hint kbd, .job-picker kbd {
        display: inline-block;
        margin: 0 3px;
        padding: 1px 6px;
        border: 1px solid rgba(255, 224, 138, 0.8);
        border-radius: 4px;
        background: rgba(255, 224, 138, 0.14);
        color: #ffe08a;
        font: inherit;
      }
      @keyframes hintIn { from { opacity: 0; transform: translate(-50%, 6px); } }

      /* "What is your job?" popup: the hub's dark glass panel with its game tiles. */
      .job-picker {
        --font-display: "Orbitron", "Segoe UI", system-ui, sans-serif;
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(8, 6, 16, 0.7);
        backdrop-filter: blur(6px);
      }
      .job-picker[hidden] { display: none; }
      .job-picker-panel {
        position: relative;
        box-sizing: border-box;
        width: min(1000px, 100%);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 26px 28px 30px;
        border: 1.5px solid transparent;
        border-radius: 22px;
        background:
          linear-gradient(160deg, rgba(22, 31, 74, 0.94), rgba(11, 16, 44, 0.94)) padding-box,
          linear-gradient(135deg, rgba(34, 211, 238, 0.85), rgba(139, 92, 246, 0.75) 55%, rgba(34, 211, 238, 0.22)) border-box;
        box-shadow: 0 30px 70px rgba(2, 6, 23, 0.6), 0 0 46px rgba(56, 189, 248, 0.16);
        color: #fff;
        animation: pickerIn 0.22s ease;
      }
      @keyframes pickerIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
      .job-picker-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 800;
        letter-spacing: 0.05em;
        text-align: center;
        text-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
      }
      .job-picker-sub {
        margin: 6px 0 22px;
        text-align: center;
        font-size: 13px;
        color: rgba(191, 219, 254, 0.8);
      }
      .job-picker-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .job-picker-close:hover, .job-picker-close:focus-visible { border-color: #22d3ee; outline: none; box-shadow: 0 0 14px rgba(34, 211, 238, 0.45); }
      .job-picker-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        padding: 4px;
      }
      @media (max-width: 900px) { .job-picker-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 640px) {
        .job-picker-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .job-picker-panel { padding: 22px 16px 20px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .interact-hint, .job-picker-panel { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div class="hmrc-hud">
      <a href="./index.html">← Hub</a>
      <span class="title">HMRC MODE</span>
      <span class="keys">WASD / Arrows to walk · Enter at a stall</span>
    </div>

    <div id="onboardingOverlay" class="onboarding-overlay">
      <div class="onboarding-card">
        <h2>Welcome</h2>
        <p>Please enter your details to begin the HMRC game.</p>

        <form id="onboardingForm" novalidate>
          <div class="form-row">
            <label for="playerName">Name</label>
            <input id="playerName" name="name" type="text" maxlength="80" placeholder="Enter your name" />
            <div id="nameError" class="error-text"></div>
          </div>

          <div class="form-row">
            <label for="playerAge">Age</label>
            <input id="playerAge" name="age" type="number" min="1" max="120" placeholder="Enter your age" />
            <div id="ageError" class="error-text"></div>
          </div>

          <div class="form-row">
            <label for="employmentStatus">Employment status</label>
            <select id="employmentStatus" name="employmentStatus">
              <option value="">Select status</option>
              <option value="Employed">Employed</option>
              <option value="Self-employed">Self-employed</option>
            </select>
            <div id="employmentError" class="error-text"></div>
          </div>

          <button type="submit" class="submit-btn">Start Game</button>
        </form>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.esm.min.js"
        }
      }
    </script>
    <script type="module" src="./hmrc-module/main.js?v=6"></script>
  </body>
</html>
