<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Hub Racing Demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; }
      body { font-family: Arial, sans-serif; }
      #racing-root {
        position: fixed;
        inset: 0;
        background: linear-gradient(#6f96ce, #d7d9d6 50%, #f1d09a);
      }
      #racing-root::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.42) 100%);
        pointer-events: none;
      }
      canvas { display: block; width: 100%; height: 100%; }
      .hud {
        display: flex;
        position: fixed;
        right: 20px;
        top: 20px;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(9, 14, 18, 0.52);
        color: white;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      }
      .hud-row { display: flex; gap: 12px; align-items: baseline; }
      .hud-value { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
      .hud-label { opacity: 0.72; }
      #race-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(7, 10, 14, 0.35);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }
      #race-overlay.hidden { display: none; }
      #race-message {
        font-size: clamp(42px, 7vw, 100px);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: white;
        text-transform: uppercase;
        text-shadow: 0 8px 30px rgba(0,0,0,0.5);
      }
      .restart-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 12px 18px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #1d4ed8, #38bdf8);
        color: white;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(10, 82, 185, 0.4);
      }
      .restart-button[hidden] { display: none; }
      .question-hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(10px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 22px;
        border-radius: 12px;
        background: rgba(9, 14, 18, 0.72);
        color: white;
        letter-spacing: 0.02em;
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        max-width: 640px;
        width: calc(100% - 48px);
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .question-hud.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
      .question-hud .question-text { font-size: 15px; font-weight: 700; line-height: 1.4; }
      .question-hud .question-answers { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 12px; }
      .question-hud .answer-chip { display: flex; align-items: center; gap: 6px; padding: 3px 7px; border-radius: 6px; border: 1.5px solid transparent; }
      .question-hud .answer-chip.hinted { border-color: #ffffff; background: rgba(255,255,255,0.14); box-shadow: 0 0 10px rgba(255,255,255,0.45); }
      .hint-button {
        position: fixed;
        left: 20px;
        top: 20px;
        padding: 8px 12px;
        border: 1px solid rgba(255,255,255,0.4);
        border-radius: 8px;
        background: rgba(9, 14, 18, 0.72);
        color: white;
        font: 700 12px Arial, sans-serif;
        letter-spacing: 0.08em;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }
      .hint-button:hover { border-color: #fff; }
      .race-results {
        margin-top: 18px;
        min-width: 280px;
        padding: 18px 26px;
        border-radius: 12px;
        background: rgba(9, 14, 18, 0.78);
        color: white;
        box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      }
      .race-results[hidden] { display: none; }
      .race-results .result-row { display: flex; justify-content: space-between; gap: 24px; padding: 5px 0; font-size: 15px; }
      .race-results .result-row span:first-child { opacity: 0.75; }
      .race-results .result-row span:last-child { font-weight: 700; }
      .race-results .result-time { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); }
      .race-results .result-time span:first-child { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
      .race-results .result-time span:last-child { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .race-results .result-amount { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); text-align: center; font-size: 22px; font-weight: 800; color: #ffd166; }
      .question-hud .answer-number { font-weight: 800; margin-right: -2px; }
      .question-hud .answer-label { color: #f2f4f7; }
      .question-hud .answer-swatch { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
    </style>
  </head>
  <body>
    <div id="racing-root"></div>
    <div class="hud" id="hud">
      <div class="hud-row"><span class="hud-label">Speed</span><span class="hud-value" id="hud-speed">0 mph</span></div>
      <div class="hud-row"><span class="hud-label">Time</span><span class="hud-value" id="hud-time">0:00.000</span></div>
    </div>
    <div class="question-hud" id="question-hud">
      <div class="question-text" id="question-text"></div>
      <div class="question-answers" id="question-answers"></div>
    </div>
    <div id="race-overlay">
      <div id="race-message">3</div>
      <div id="race-results" class="race-results" hidden>
        <div class="result-time"><span>Final Time</span><span id="result-time">0:00.000</span></div>
        <div class="result-row"><span>Correct answers</span><span id="result-correct">0</span></div>
        <div class="result-row"><span>Total questions</span><span id="result-total">0</span></div>
        <div class="result-row"><span>Final score</span><span id="result-score">0%</span></div>
        <div class="result-amount" id="result-amount">Amount Won: £0</div>
      </div>
    </div>
    <button id="restart-button" class="restart-button" hidden>Restart</button>
    <button id="hint-button" class="hint-button" title="Toggle hint (H)">HINT: OFF</button>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./racing-module/main.js?v=26"></script>
  </body>
</html>
