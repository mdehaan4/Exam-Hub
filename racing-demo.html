<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Hub Racing Demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; }
      body { font-family: Arial, sans-serif; }
      #racing-root {
        position: fixed;
        inset: 0;
        background: linear-gradient(#6f96ce, #d7d9d6 50%, #f1d09a);
      }
      #racing-root::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.42) 100%);
        pointer-events: none;
      }
      canvas { display: block; width: 100%; height: 100%; }
      .hud {
        display: none;
        position: fixed;
        left: 20px;
        top: 20px;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(9, 14, 18, 0.52);
        color: white;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      }
      .hud-row { display: flex; gap: 12px; align-items: baseline; }
      .hud-value { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
      .hud-label { opacity: 0.72; }
      .hud-objective { font-size: 11px; letter-spacing: 0.06em; line-height: 1.5; max-width: 300px; }
      #race-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 10, 14, 0.35);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }
      #race-overlay.hidden { display: none; }
      #race-message {
        font-size: clamp(42px, 7vw, 100px);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: white;
        text-transform: uppercase;
        text-shadow: 0 8px 30px rgba(0,0,0,0.5);
      }
      .restart-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 12px 18px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #1d4ed8, #38bdf8);
        color: white;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(10, 82, 185, 0.4);
      }
      .restart-button[hidden] { display: none; }
      .question-hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(10px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 22px;
        border-radius: 12px;
        background: rgba(9, 14, 18, 0.72);
        color: white;
        letter-spacing: 0.02em;
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        max-width: 640px;
        width: calc(100% - 48px);
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .question-hud.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
      .question-hud .question-text { font-size: 15px; font-weight: 700; line-height: 1.4; }
      .question-hud .question-answers { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 12px; }
      .question-hud .answer-chip { display: flex; align-items: center; gap: 6px; }
    </style>
  </head>
  <body>
    <div id="racing-root"></div>
    <div class="hud" id="hud">
      <div class="hud-row"><span class="hud-label">Speed</span><span class="hud-value" id="hud-speed">0</span></div>
      <div class="hud-row"><span class="hud-label">Objective</span><span class="hud-value" id="hud-objective">Race</span></div>
      <div class="hud-objective" id="hud-text">WASD / Arrows to drive — reach the finish line.</div>
    </div>
    <div class="question-hud" id="question-hud">
      <div class="question-text" id="question-text"></div>
      <div class="question-answers" id="question-answers"></div>
    </div>
    <div id="race-overlay">
      <div id="race-message">3</div>
    </div>
    <button id="restart-button" class="restart-button" hidden>Restart</button>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./racing-module/main.js"></script>
  </body>
</html>
